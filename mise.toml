[tools]
node = "24.20.0"
uv = "0.12.9"
erlang = "28.4.1"
elixir = "1.19.5-otp-28"

[tasks."check:docs"]
description = "Check bilingual documents and reference metadata"
run = "elixir scripts/check_docs.exs"

[tasks."check:prompt-injection"]
description = "Check documents for prompt-injection indicators"
run = "mix run scripts/check_prompt_injection.exs"

[tasks."check:privacy"]
description = "Check maintained documents for direct identifier patterns"
run = "elixir scripts/check_privacy.exs"

[tasks."check:format"]
description = "Check Elixir formatting"
run = "mix format --check-formatted"

[tasks."check:compile"]
description = "Compile the local reader without warnings"
run = "mix compile --warnings-as-errors"

[tasks."check:reader"]
description = "Run local reader and capture tests"
run = "mix test"

[tasks."check:deps-lock"]
description = "Check for unused locked dependencies"
run = "mix deps.unlock --check-unused"

[tasks."check:deps-audit"]
description = "Check Hex dependencies for known advisories"
run = "mix hex.audit"

[tasks."export:gist:en"]
description = "Export the English GitHub Gist edition"
run = "elixir scripts/export_gist.exs en _build/gists/en"

[tasks."export:gist:es"]
description = "Export the Spanish GitHub Gist edition"
run = "elixir scripts/export_gist.exs es _build/gists/es"

[tasks."export:gist"]
description = "Export both GitHub Gist editions"
depends = ["export:gist:en", "export:gist:es"]

[tasks."review:snapshots"]
description = "Scan snapshots and record a reviewed body hash"
run = "mix run scripts/record_snapshot_review.exs"

[tasks.verify]
description = "Run all repository checks"
depends = [
  "check:compile",
  "check:deps-audit",
  "check:deps-lock",
  "check:docs",
  "check:format",
  "check:prompt-injection",
  "check:privacy",
  "check:reader",
  "export:gist",
]

[tasks."workspace:setup"]
description = "Install the local docs, review, and Aspire tools"
run = "npm ci && npm ci --prefix tools/review/web && uv sync --project tools --frozen && uv run --project tools python tools/docs/codeview/vendor.py && npx aspire restore --non-interactive"

[tasks."workspace:start"]
description = "Start the local SDLC workspace"
run = "npx aspire start --isolated --non-interactive"

[tasks."workspace:stop"]
description = "Stop this SDLC workspace"
run = "npx aspire stop --non-interactive"

[tasks."docs:build"]
description = "Build documentation from configured roots"
run = "uv run --project tools python tools/docs/serve.py --build"

[tasks."workspace:check"]
description = "Check the Python services and review UI"
run = "uv run --project tools python -m unittest discover -s tools/tests && tools/review/web/node_modules/.bin/vue-tsc --noEmit -p tools/review/web/tsconfig.json && npx tsc --noEmit -p tsconfig.apphost.json"
